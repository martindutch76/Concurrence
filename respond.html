<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Concurrence — Respond to request</title>
<style>
  :root{
    --night:#14262B; --night-deep:#0D1A1D;
    --brass:#C99A3E; --brass-soft:#E3C077;
    --ember:#B65C38; --stone:#EDE6D6; --stone-line:#D9CFB7;
    --ink:#1B2422; --ink-soft:#5B655F; --card:#FFFFFF;
  }
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--night); min-height:100vh; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; color:#fff; display:flex; align-items:center; justify-content:center; padding:32px 20px; }
  .serif{ font-family:"New York",ui-serif,Georgia,"Times New Roman",serif; }
  .wrap{ width:100%; max-width:400px; }
  .brand-row{ display:flex; align-items:center; gap:10px; justify-content:center; margin-bottom:24px; }
  .brand-row svg{ width:26px; height:26px; }
  .brand-row span{ font-size:17px; font-weight:500; }
  .card{ background:var(--card); color:var(--ink); border-radius:8px; padding:30px 28px; box-shadow:0 20px 60px rgba(0,0,0,0.35); text-align:center; }
  .card h1{ font-size:19px; margin:0 0 10px; font-weight:500; }
  .card p{ font-size:13.5px; color:var(--ink-soft); line-height:1.55; margin:0 0 20px; }
  .btn{ border:none; padding:11px 18px; border-radius:5px; font-size:13px; font-weight:600; cursor:pointer; }
  .btn.brass{ background:var(--brass); color:var(--night-deep); }
  .btn.ghost{ background:#fff; border:1px solid var(--stone-line); color:var(--ink); }
  .actions{ display:flex; gap:10px; justify-content:center; }
  .icon{ width:44px; height:44px; border-radius:50%; display:flex; align-items:center; justify-content:center; margin:0 auto 14px; }
  .icon.ok{ background:#DDEAE0; color:#2E6B44; }
  .icon.warn{ background:#F2E9D3; color:#8A6A24; }
  .icon.err{ background:#F3DCD5; color:#8A3B26; }
  .icon svg{ width:20px; height:20px; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="brand-row">
      <svg viewBox="0 0 120 120">
        <path d="M 107.55 75.45 Q 85.02 75.63 68.56 62.78" stroke="#E3C077" stroke-width="1.4" stroke-linecap="round" fill="none" opacity="0.55"/>
        <path d="M 66.12 103.57 Q 68.19 85.20 61.25 68.91" stroke="#E3C077" stroke-width="2.2" stroke-linecap="round" fill="none" opacity="0.8"/>
        <path d="M 27.37 101.76 Q 34.92 78.22 54.46 67.09" stroke="#E3C077" stroke-width="1.1" stroke-linecap="round" fill="none" opacity="0.4"/>
        <path d="M 13.06 57.54 Q 32.11 62.44 51.01 59.53" stroke="#E3C077" stroke-width="3.0" stroke-linecap="round" fill="none" opacity="1.0"/>
        <path d="M 30.32 12.51 Q 48.88 29.46 55.23 52.37" stroke="#E3C077" stroke-width="1.6" stroke-linecap="round" fill="none" opacity="0.6"/>
        <path d="M 81.13 20.27 Q 67.44 34.05 64.23 52.05" stroke="#E3C077" stroke-width="2.4" stroke-linecap="round" fill="none" opacity="0.85"/>
        <circle cx="60" cy="60" r="7" fill="#C99A3E"/>
      </svg>
      <span class="serif">Concurrence</span>
    </div>
    <div class="card" id="card"><p>Loading…</p></div>
    <div style="text-align:center;font-size:11px;color:#9FADA7;opacity:0.6;margin-top:14px;">Beta 1.00</div>
  </div>

<script>
(function(){
  const SUPABASE_URL = 'https://foqrzkrmdwavpewjivex.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZvcXJ6a3JtZHdhdnBld2ppdmV4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkwMzMzNTgsImV4cCI6MjEwNDYwOTM1OH0.VOMkTGoVjxieo-rWGTgAsbsDaA2SvJXkDrjuxc623QE';
  const FUNCTION_URL = SUPABASE_URL + '/functions/v1/respond-sister';

  const params = new URLSearchParams(window.location.search);
  const relationshipId = params.get('rel');
  const card = document.getElementById('card');

  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

  async function callFn(action){
    const res = await fetch(FUNCTION_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'apikey': SUPABASE_ANON_KEY, 'Authorization': 'Bearer ' + SUPABASE_ANON_KEY },
      body: JSON.stringify({ relationshipId, action })
    });
    return res.json();
  }

  function showError(msg){
    card.innerHTML = `<div class="icon err"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg></div><h1 class="serif">Something went wrong</h1><p>${esc(msg)}</p>`;
  }

  function showDone(status, fromDivision, toDivision){
    const isConfirmed = status === 'confirmed';
    card.innerHTML = `
      <div class="icon ${isConfirmed?'ok':'warn'}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">${isConfirmed?'<path d="M20 6L9 17l-5-5"/>':'<path d="M6 18L18 6M6 6l12 12"/>'}</svg></div>
      <h1 class="serif">${isConfirmed ? 'Sister divisions confirmed' : 'Request declined'}</h1>
      <p>${esc(toDivision)} and ${esc(fromDivision)} are ${isConfirmed ? 'now standing sister divisions' : 'not becoming sister divisions at this time'}. You can close this page.</p>
    `;
  }

  async function boot(){
    if(!relationshipId){ showError('This link is missing some information — please use the link from the original email.'); return; }
    const info = await callFn('info');
    if(info.error){ showError(info.error); return; }

    if(info.status !== 'pending'){
      showDone(info.status, info.fromDivision, info.toDivision);
      return;
    }

    card.innerHTML = `
      <h1 class="serif">${esc(info.fromDivision)} wants to become sister divisions</h1>
      <p>Accepting pins them as a standing partner on ${esc(info.toDivision)}'s dashboard — a good fit if you meet at a similar hour and want to combine sessions occasionally.</p>
      <div class="actions">
        <button class="btn ghost" id="declineBtn">Decline</button>
        <button class="btn brass" id="acceptBtn">Accept</button>
      </div>
    `;
    document.getElementById('acceptBtn').onclick = async ()=>{
      card.innerHTML = '<p>Confirming…</p>';
      const r = await callFn('accept');
      if(r.error){ showError(r.error); return; }
      showDone(r.status, r.fromDivision, r.toDivision);
    };
    document.getElementById('declineBtn').onclick = async ()=>{
      card.innerHTML = '<p>Recording your response…</p>';
      const r = await callFn('decline');
      if(r.error){ showError(r.error); return; }
      showDone(r.status, r.fromDivision, r.toDivision);
    };
  }

  boot();
})();
</script>
</body>
</html>
