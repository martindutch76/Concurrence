<style>
  :root{
    --night:#14262B; --night-deep:#0D1A1D;
    --brass:#C99A3E; --brass-soft:#E3C077;
    --ember:#B65C38; --stone:#EDE6D6; --stone-line:#D9CFB7;
    --ink:#1B2422; --ink-soft:#5B655F; --card:#FFFFFF;
  }
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--stone); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; font-size:13.5px; }
  .serif{ font-family:"New York",ui-serif,Georgia,"Times New Roman",serif; }
  a{ color:inherit; }
  .nav{ display:flex; flex-direction:column; gap:2px; margin-bottom:18px; }
  .nav a{ display:flex; align-items:center; padding:8px 10px; border-radius:4px; font-size:13px; text-decoration:none; color:#C9CFC9; cursor:pointer; }
  .nav a.active{ background:rgba(255,255,255,0.08); color:#fff; font-weight:600; }
  .nav a:hover{ color:#fff; }
  button{ font-family:inherit; cursor:pointer; }

  .shell{ display:grid; grid-template-columns:216px 1fr; min-height:100vh; }
  .side{ background:var(--night); color:var(--stone); padding:22px 16px; display:flex; flex-direction:column; }
  .side-brand{ display:flex; align-items:center; gap:9px; margin-bottom:22px; padding:0 4px; }
  .side-brand svg{ width:24px; height:24px; }
  .side-brand span{ font-size:16px; font-weight:500; color:#fff; }
  .org-path{ font-size:11px; color:#9FADA7; line-height:1.5; margin-bottom:20px; padding:0 4px; }
  .org-name{ font-size:14px; font-weight:600; color:#fff; margin-bottom:6px; }
  .org-path b{ color:var(--brass-soft); font-weight:500; }
  .side-foot{ font-size:11px; color:#7C8985; padding:0 4px; margin-top:auto; }
  .signout-link{ font-size:11px; color:#9FADA7; text-decoration:none; cursor:pointer; display:block; margin-top:8px; }
  .signout-link:hover{ color:#fff; }

  .main{ padding:26px 34px 60px; max-width:900px; }
  .topline{ display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:22px; }
  .topline h1{ font-size:24px; margin:0 0 2px; font-weight:500; }
  .topline .sub{ font-size:13px; color:var(--ink-soft); }
  .avatar{ width:34px; height:34px; border-radius:50%; background:var(--brass); color:var(--night-deep); display:flex; align-items:center; justify-content:center; font-weight:600; font-size:13px; flex:none; }

  .next-card{ background:var(--night); color:#fff; border-radius:6px; padding:24px 26px; display:flex; justify-content:space-between; align-items:center; gap:20px; flex-wrap:wrap; }
  .next-card .unit-title{ font-size:22px; font-weight:500; color:#fff; margin-bottom:10px; }
  .next-card .lbl{ font-size:11.5px; color:#9FADA7; margin-bottom:6px; }
  .next-card .when{ font-size:28px; font-weight:500; }
  .next-card .where{ font-size:13px; color:#C9CFC9; margin-top:4px; }
  .btn{ background:var(--night); color:#fff; border:none; padding:8px 14px; border-radius:4px; font-size:12.5px; font-weight:600; }
  .btn.brass{ background:var(--brass); color:var(--night-deep); }
  .btn.ghost{ background:transparent; border:1px solid rgba(255,255,255,0.35); color:#fff; }

  .loading, .err, .empty{ padding:30px; text-align:center; color:var(--ink-soft); font-size:13px; }
  .err{ color:var(--ember); }
  .version-tag{ position:fixed; bottom:6px; left:6px; font-size:10px; color:#B7B0A0; font-family:ui-monospace,monospace; z-index:100; background:rgba(255,255,255,0.7); padding:1px 5px; border-radius:3px; }

  /* icon badges — in-person / video status, with instant CSS tooltips */
  .icon-badge{ display:inline-flex; align-items:center; justify-content:center; width:22px; height:22px; border-radius:5px; flex:none; position:relative; }
  .icon-badge svg{ width:13px; height:13px; }
  .icon-badge.active{ color:#8A6A24; background:#F2E9D3; }
  .icon-badge.inactive{ color:#B7B0A0; background:#EAE5D8; }
  .icon-badge[data-tip]:hover::after{
    content:attr(data-tip); position:absolute; top:calc(100% + 6px); left:50%; transform:translateX(-50%);
    background:#14262B; color:#fff; font-size:10.5px; font-weight:600; padding:4px 8px; border-radius:4px;
    white-space:nowrap; pointer-events:none; z-index:50; box-shadow:0 3px 8px rgba(0,0,0,0.25);
  }
  .icon-badge-row{ display:inline-flex; gap:6px; align-items:center; vertical-align:middle; }

  // Walks parent_id up from the user's node to the root, returning an
  // ordered array [national, state, region, division] for the breadcrumb.
  async function buildNodePath(nodeId){
    const path = [];
    let currentId = nodeId;
    let guard = 0;
    while(currentId && guard < 10){
      guard++;
      const { data: node } = await sb.from('hierarchy_nodes').select('id,name,parent_id,level_id,org_id').eq('id', currentId).maybeSingle();
      if(!node) break;
      path.unshift(node);
      currentId = node.parent_id;
    }
    return path;
  }

  // Finds the next date/time this recurring meeting falls on, in its own
  // timezone, correctly accounting for daylight saving via Luxon (no
  // hand-maintained offsets, no manual DST toggle to forget).
  function nextOccurrence(dayOfWeek, startTime, endTime, timezone){
    const targetIsoWeekday = dayOfWeek === 0 ? 7 : dayOfWeek; // Luxon: Mon=1..Sun=7
    const [sh, sm] = startTime.split(':').map(Number);
    const [eh, em] = endTime.split(':').map(Number);
    const now = DateTime.now().setZone(timezone);
    let candidate = now.set({ hour: sh, minute: sm, second: 0, millisecond: 0 });
    while(candidate.weekday !== targetIsoWeekday || candidate < now){
      candidate = candidate.plus({ days: 1 }).set({ hour: sh, minute: sm, second: 0, millisecond: 0 });
    }
    const end = candidate.set({ hour: eh, minute: em });
    return { start: candidate, end };
  }

  function icsHref(summary, location, dtStartUTC, dtEndUTC){
    const fmt = "yyyyMMdd'T'HHmmss'Z'";
    const lines = [
      'BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Concurrence//EN','BEGIN:VEVENT',
      `UID:${crypto.randomUUID()}@concurrence.app`,
      `DTSTART:${dtStartUTC.toFormat(fmt)}`,
      `DTEND:${dtEndUTC.toFormat(fmt)}`,
      `SUMMARY:${summary}`,
      `LOCATION:${location}`,
      'END:VEVENT','END:VCALENDAR'
    ].join('\r\n');
    return 'data:text/calendar;charset=utf8,' + encodeURIComponent(lines);
  }

        p_timezone: back.querySelector('#eTz').value,
        p_address: back.querySelector('#eAddress').value.trim()
      });
      if(error){ back.querySelector('#eErr').textContent = error.message; btn.disabled=false; btn.textContent='Save'; return; }
      back.remove();
      onSaved();
    };
  }

  async function renderMyMeeting(profile, nodePath, isApproved){
    const deepest = nodePath.length ? nodePath[nodePath.length-1] : null;
    const orgLabel = deepest ? deepest.name : 'your group';

    mainMount.innerHTML = `
      <div id="dashboardMount">
        <div class="topline">
          <div>
            <h1 class="serif">Good day, ${esc(profile.first_name)}</h1>
            <div class="sub">${esc(orgLabel)}</div>
          </div>
          <div class="avatar">${esc((profile.first_name||' ')[0])}${esc((profile.last_name||' ')[0])}</div>
        </div>
        <div id="meetingCardMount"><div class="loading">Loading your meeting…</div></div>
        <div id="concurrentMount"></div>
      </div>
      <div id="otherEventsMount" style="display:none;"></div>
      <div id="libraryMount" style="display:none;"></div>
      <div id="keywordMount" style="display:none;"></div>
      <div id="profileMount" style="display:none;"></div>
      <div id="aboutMount" style="display:none;"></div>
    `;

    if(!deepest){
      document.getElementById('meetingCardMount').innerHTML = `<div class="empty">No group on file for your account yet.</div>`;
      return null;
    }

    const { data: meeting, error } = await sb
      .from('meetings')
      .select('frequency, day_of_week, start_time, end_time, timezone, address, edited_by, edited_at')
      .eq('node_id', deepest.id)
      .maybeSingle();

    const mount = document.getElementById('meetingCardMount');
    if(error){ mount.innerHTML = `<div class="err">Couldn't load your meeting: ${esc(error.message)}</div>`; return null; }
    if(!meeting){ mount.innerHTML = `<div class="empty">No meeting has been set up for ${esc(orgLabel)} yet.</div>`; return null; }

    const { start, end } = nextOccurrence(meeting.day_of_week, meeting.start_time, meeting.end_time, meeting.timezone);
    const whenLabel = start.toFormat('ccc d LLL · h:mma').toLowerCase().replace(/^\w/, c=>c.toUpperCase());
    const summary = `${orgLabel} meeting`;
    const href = icsHref(summary, meeting.address || '', start.toUTC(), end.toUTC());

    let editorLine = '';
    if(meeting.edited_by){
      const { data: editor } = await sb.from('profiles').select('first_name,last_name').eq('id', meeting.edited_by).maybeSingle();
      const editedDate = DateTime.fromISO(meeting.edited_at).toFormat('d LLL yyyy, h:mma');
      editorLine = `<div style="font-size:11px;color:var(--ink-soft);margin-top:10px;">Last edited by ${editor ? esc(editor.first_name+' '+editor.last_name) : 'unknown'} on ${editedDate}</div>`;
    }

    mount.innerHTML = `
      <div class="next-card">
        <div>
          <div class="unit-title serif">${esc(orgLabel)}</div>
          <div class="lbl">Your group's next meeting</div>
          <div class="when serif">${esc(whenLabel)}</div>
          <div class="where">${esc(meeting.address || 'No address on file')} · ${esc(meeting.frequency)}</div>
        </div>
        <div style="display:flex;flex-direction:column;align-items:flex-end;gap:8px;">
          <a class="btn brass" href="${href}" download="${summary.replace(/[^a-z0-9]+/gi,'-')}.ics">Add to calendar</a>
          ${isApproved ? '<button class="btn ghost" id="editMeetingBtn">Edit</button>' : ''}
        </div>
      </div>
      ${editorLine}
      <div id="sessionMount" style="margin-top:14px;"></div>
    `;

    if(isApproved){
      document.getElementById('editMeetingBtn').onclick = ()=>{
        openEditMeetingModal(deepest.id, orgLabel, meeting, ()=> window.__refreshDashboard());
      };
    }

    await renderSession(deepest.id, orgLabel, start.toISODate(), isApproved, ()=> window.__refreshDashboard());

    return { meeting, start, end };
  }

  // ---------- This week's session: topic, presenter, keywords, in-person/video, no-meeting ----------
  async function renderSession(nodeId, orgLabel, isoDate, isApproved, onSaved){
    const box = document.getElementById('sessionMount');
    if(!box) return;
    box.innerHTML = `<div class="loading" style="padding:14px 0;">Loading this week's topic…</div>`;

    const { data, error } = await sb.rpc('get_sessions_for_node', {
      check_node_id: nodeId, from_date: isoDate, to_date: isoDate
    });
    if(error){ box.innerHTML = `<div class="err">${esc(error.message)}</div>`; return; }
    const session = (data && data[0]) ? data[0] : null;

    if(session && session.no_meeting){
      box.innerHTML = `
        <div style="background:repeating-linear-gradient(135deg,var(--card),var(--card) 8px,#F1EEE6 8px,#F1EEE6 16px);border:1px dashed var(--stone-line);border-radius:6px;padding:14px 16px;">
          <div style="font-weight:600;font-size:13px;color:var(--ink-soft);">No meeting this week${session.no_meeting_reason ? ' — '+esc(session.no_meeting_reason) : ''}</div>
          ${isApproved ? '<button class="btn ghost" id="sessEditBtn" style="margin-top:8px;border:1px solid var(--stone-line);color:var(--ink);">Edit</button>' : ''}
        </div>`;
      if(isApproved) document.getElementById('sessEditBtn').onclick = ()=> openSessionModal(nodeId, orgLabel, isoDate, session, onSaved);
      return;
    }

    if(!session || !session.topic){
      box.innerHTML = `
        <div style="border:1px dashed var(--stone-line);border-radius:6px;padding:14px 16px;">
          <div style="color:var(--ink-soft);font-size:13px;">No topic set for this week yet.</div>
          ${isApproved ? '<button class="btn brass" id="sessEditBtn" style="margin-top:8px;">Add topic</button>' : ''}
        </div>`;
      if(isApproved) document.getElementById('sessEditBtn').onclick = ()=> openSessionModal(nodeId, orgLabel, isoDate, session, onSaved);
      return;
    }

    const kwHtml = (session.keywords||[]).map(k=>`<span style="display:inline-block;background:var(--stone);border-radius:10px;padding:1px 8px;font-size:10.5px;color:var(--ink-soft);margin-right:4px;">${esc(k)}</span>`).join('');

    }
    const recHtml = session.recording_url
      ? `<a href="${esc(session.recording_url)}" target="_blank" rel="noopener" style="font-size:11px;color:#2E6B44;font-weight:600;text-decoration:none;">▶ Watch recording</a>`
      : (isApproved ? `<button id="recAddBtn" style="background:none;border:none;color:var(--ink-soft);font-size:11px;text-decoration:underline;cursor:pointer;padding:0;">+ Add recording</button>` : '');
    box.innerHTML = `
      <div style="border:1px solid var(--stone-line);border-radius:6px;padding:16px 18px;background:var(--card);">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;">
          <div>
            <div style="font-size:11px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:0.03em;margin-bottom:4px;">This week's topic</div>
            <div style="font-size:14px;font-weight:600;display:flex;align-items:center;flex-wrap:wrap;gap:2px;">${esc(session.topic)}${jointHtml}</div>
            <div style="font-size:12px;color:var(--ink-soft);margin-top:4px;">${session.presenter ? esc(session.presenter) : ''}</div>
            <div class="icon-badge-row" style="margin-top:8px;">${inPersonBadge(!!session.in_person)}${videoBadge(!!session.video_url)}</div>
            <div style="margin-top:8px;">${kwHtml}</div>
          </div>
          ${isApproved ? '<button class="btn ghost" id="sessEditBtn" style="border:1px solid var(--stone-line);color:var(--ink);flex:none;">Edit</button>' : ''}
        </div>
        ${recHtml ? `<div style="margin-top:10px;">${recHtml}</div>` : ''}
      </div>`;
    if(isApproved) document.getElementById('sessEditBtn').onclick = ()=> openSessionModal(nodeId, orgLabel, isoDate, session, onSaved);
    if(isApproved && !session.recording_url){
      document.getElementById('recAddBtn').onclick = ()=>{
        const url = prompt('Paste the recording link:');
        if(!url) return;
        sb.rpc('save_recording_url', { p_node_id: nodeId, p_session_date: isoDate, p_recording_url: url.trim() })

  function openSessionModal(nodeId, orgLabel, isoDate, session, onSaved){
    const s = session || {};
    const dateLabel = DateTime.fromISO(isoDate).toFormat('cccc d LLL');
    const back = document.createElement('div');
    back.style.cssText = 'position:fixed;inset:0;background:rgba(20,20,18,0.45);display:flex;align-items:center;justify-content:center;z-index:60;padding:16px;';
    back.innerHTML = `
      <div style="background:#fff;border-radius:8px;padding:22px 24px;max-width:420px;width:100%;max-height:86vh;overflow:auto;">
        <h3 class="serif" style="margin:0 0 4px;font-size:16px;">${esc(orgLabel)} — ${esc(dateLabel)}</h3>
        <label style="display:flex;align-items:flex-start;gap:8px;margin:14px 0;cursor:pointer;">
          <input type="checkbox" id="sNoMeeting" ${s.no_meeting ? 'checked' : ''} style="margin-top:3px;">
          <span style="font-size:12.5px;color:var(--ink-soft);"><b style="color:var(--ink);">No meeting this week</b><br>Public holidays, school holidays, etc.</span>
        </label>
        <div id="sFields" style="display:flex;flex-direction:column;gap:9px;${s.no_meeting?'opacity:0.4;pointer-events:none;':''}">
          <input type="text" id="sTopic" placeholder="Topic" value="${esc(s.topic||'')}" style="padding:8px 10px;border:1px solid var(--stone-line);border-radius:5px;font-family:inherit;font-size:13px;">
          <input type="text" id="sPresenter" placeholder="Presenter name" value="${esc(s.presenter||'')}" style="padding:8px 10px;border:1px solid var(--stone-line);border-radius:5px;font-family:inherit;font-size:13px;">
          <label style="display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink-soft);"><input type="checkbox" id="sInPerson" ${s.in_person!==false?'checked':''}> In person</label>
          <input type="text" id="sVideo" placeholder="Video link (leave blank if not online)" value="${esc(s.video_url||'')}" style="padding:8px 10px;border:1px solid var(--stone-line);border-radius:5px;font-family:inherit;font-size:13px;">
          <input type="text" id="sKeywords" placeholder="Keywords, comma separated" value="${esc((s.keywords||[]).join(', '))}" style="padding:8px 10px;border:1px solid var(--stone-line);border-radius:5px;font-family:inherit;font-size:13px;">
          <label style="font-size:11.5px;color:var(--ink-soft);">Joint session with (optional)</label>
          <select id="sJoint" style="padding:8px 10px;border:1px solid var(--stone-line);border-radius:5px;font-family:inherit;font-size:13px;">
            <option value="">None — just us</option>
          </select>
        </div>
        <div id="sErr" style="font-size:11.5px;color:var(--ember);min-height:14px;margin-top:8px;"></div>
        <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:14px;">
          <button class="btn ghost" id="sCancel" style="border:1px solid var(--stone-line);color:var(--ink);">Cancel</button>
          <button class="btn brass" id="sSave">Save</button>
        </div>
      </div>`;
    document.body.appendChild(back);
    back.addEventListener('click', e=>{ if(e.target===back) back.remove(); });
    back.querySelector('#sCancel').onclick = ()=> back.remove();
    back.querySelector('#sNoMeeting').onchange = function(){
      const f = back.querySelector('#sFields');
      f.style.opacity = this.checked ? '0.4' : '1';
      f.style.pointerEvents = this.checked ? 'none' : 'auto';
    };

    // Populate the joint-partner dropdown with confirmed sister divisions only.
    (async ()=>{
      const { data: rels } = await sb.from('sister_relationships')
        .select('id,node_a,node_b,status')
        .or(`node_a.eq.${nodeId},node_b.eq.${nodeId}`)
        .eq('status', 'confirmed');
      if(!rels || !rels.length) return;
      const partnerIds = rels.map(r=> r.node_a===nodeId ? r.node_b : r.node_a);
      const { data: partners } = await sb.from('hierarchy_nodes').select('id,name').in('id', partnerIds);
      const sel = back.querySelector('#sJoint');
      (partners||[]).forEach(p=>{
        const opt = document.createElement('option');
        opt.value = p.id; opt.textContent = p.name;
        if(s.joint_with_node === p.id) opt.selected = true;
        sel.appendChild(opt);
      });
    })();

    back.querySelector('#sSave').onclick = async ()=>{
      const btn = back.querySelector('#sSave'); btn.disabled = true; btn.textContent = 'Saving…';
      const noMeeting = back.querySelector('#sNoMeeting').checked;
      const jointVal = back.querySelector('#sJoint').value || null;
      const { data: saveResult, error } = await sb.rpc('save_session', {
        p_node_id: nodeId,
        p_session_date: isoDate,
        p_no_meeting: noMeeting,
        p_no_meeting_reason: noMeeting ? 'Flagged by an organisational contact' : null,
        p_topic: noMeeting ? null : back.querySelector('#sTopic').value.trim() || null,
        p_presenter: noMeeting ? null : back.querySelector('#sPresenter').value.trim() || null,
        p_in_person: noMeeting ? true : back.querySelector('#sInPerson').checked,
        p_video_url: noMeeting ? null : (back.querySelector('#sVideo').value.trim() || null),
        p_keywords: noMeeting ? [] : back.querySelector('#sKeywords').value.split(',').map(x=>x.trim()).filter(Boolean),
        p_joint_with_node: noMeeting ? null : jointVal
      });
      if(error){
        back.querySelector('#sErr').textContent = error.message;
        btn.disabled=false; btn.textContent='Save'; return;
      }
      const contactRequestId = saveResult && saveResult[0] && saveResult[0].contact_request_id;
      if(contactRequestId){
        // A new joint pairing was flagged — notify the partner division.
        // Fire-and-forget: the session itself is already saved regardless.
        sb.functions.invoke('notify-request', { body: { contactRequestId } })
          .catch(err => console.error('Joint session notification failed to send:', err));
      }
      back.remove();
      onSaved();
    };
  }

  async function renderMySisterDivisions(deepest, onDone){
    const mount = document.getElementById('sisterMount');
    if(!mount) return;
    const { data: rels, error } = await sb.from('sister_relationships')
      .select('id,node_a,node_b,status')
      .or(`node_a.eq.${deepest.id},node_b.eq.${deepest.id}`);
    if(error){ mount.innerHTML = `<div class="err">${esc(error.message)}</div>`; return; }
    if(!rels || !rels.length){ mount.innerHTML=''; return; }

    const peerIds = rels.map(r=> r.node_a===deepest.id ? r.node_b : r.node_a);
    const { data: peerNodes } = await sb.from('hierarchy_nodes').select('id,name').in('id', peerIds);
    const nameOf = id => { const n = (peerNodes||[]).find(p=>p.id===id); return n ? n.name : 'Unknown group'; };

    const confirmed = rels.filter(r=>r.status==='confirmed');
    const pendingForMe = rels.filter(r=>r.status==='pending' && r.node_b===deepest.id);

    let html = '';
    if(pendingForMe.length){
      html += `<h2 class="serif" style="font-size:17px;font-weight:500;margin:0 0 8px;">Sister division requests</h2>`;
      html += pendingForMe.map(r=>{
        const peerId = r.node_a===deepest.id ? r.node_b : r.node_a;
        return `<div style="background:var(--card);border:1px solid var(--stone-line);border-radius:6px;padding:12px 14px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:10px;">
          <span style="font-size:13px;">${esc(nameOf(peerId))} wants to become sister divisions</span>
          <button class="btn brass" data-respond2="${r.id}" data-name2="${esc(nameOf(peerId))}" style="font-size:11px;padding:6px 10px;flex:none;">Respond</button>
        </div>`;
      }).join('');
    }
    if(confirmed.length){
      html += `<h2 class="serif" style="font-size:17px;font-weight:500;margin:18px 0 8px;">My sister divisions</h2>`;
      html += `<div style="display:flex;gap:12px;flex-wrap:wrap;">` + confirmed.map(r=>{
        const peerId = r.node_a===deepest.id ? r.node_b : r.node_a;
        return `<div style="background:var(--card);border:1px solid var(--stone-line);border-radius:6px;padding:12px 14px;min-width:180px;">
          <div style="font-size:13px;font-weight:600;">${esc(nameOf(peerId))}</div>
          <div style="font-size:10.5px;color:#2E6B44;background:#DDEAE0;display:inline-block;border-radius:10px;padding:2px 8px;margin-top:5px;">Sister division</div>
        </div>`;
      }).join('') + `</div>`;
    }
    mount.innerHTML = html;
    mount.querySelectorAll('[data-respond2]').forEach(btn=>{
      btn.onclick = ()=> openRespondModal(btn.dataset.respond2, btn.dataset.name2, onDone);
    });
  }

  async function renderConcurrentMeetings(nodePath, own){
    const box = document.getElementById('concurrentMount');
    if(!box) return;
    const deepest = nodePath.length ? nodePath[nodePath.length-1] : null;
    if(!deepest || !own){ box.innerHTML = ''; return; }

    box.innerHTML = `
      <div style="margin-top:26px;background:var(--night);border-radius:6px;padding:16px 20px;margin-bottom:14px;">
        <h2 class="serif" style="font-size:17px;font-weight:500;margin:0 0 4px;color:#fff;">Concurrent Meetings</h2>
        <p style="font-size:12px;color:#B7CFC9;margin:0;">Other groups at the same level as yours, meeting at an overlapping time — converted to your local time.</p>
      </div>
      <div id="concurrentList" class="loading">Checking for overlaps…</div>
      <div id="sisterMount" style="margin-top:26px;"></div>
    `;
    const onDone = ()=> renderConcurrentMeetings(nodePath, own);
    const listEl = document.getElementById('concurrentList');

    const { data: peers, error: peersErr } = await sb
      .from('hierarchy_nodes')
      .select('id,name')
      .eq('org_id', deepest.org_id)
      .eq('level_id', deepest.level_id)
      .neq('id', deepest.id);

    if(peersErr){ listEl.innerHTML = `<div class="err">${esc(peersErr.message)}</div>`; }
    else if(!peers || !peers.length){ listEl.innerHTML = `<div class="empty">No other groups at your level yet.</div>`; }
    else {
      const { data: rels } = await sb.from('sister_relationships')
        .select('id,node_a,node_b,status')
        .or(`node_a.eq.${deepest.id},node_b.eq.${deepest.id}`);
      const relByPeer = {};
      (rels||[]).forEach(r=>{
        const peerId = r.node_a === deepest.id ? r.node_b : r.node_a;
        relByPeer[peerId] = { id: r.id, status: r.status, iAmNodeA: r.node_a === deepest.id };
      });

      const { data: meetings, error: meetErr } = await sb
        .from('meetings')
        .select('node_id, frequency, day_of_week, start_time, end_time, timezone, address')
        .in('node_id', peers.map(p=>p.id));

      if(meetErr){ listEl.innerHTML = `<div class="err">${esc(meetErr.message)}</div>`; }
      else {
        const overlaps = [];
        (meetings||[]).forEach(m=>{
          const peer = peers.find(p=>p.id===m.node_id);
          if(!peer) return;
          const occ = nextOccurrence(m.day_of_week, m.start_time, m.end_time, m.timezone);
          const overlapStartMs = Math.max(occ.start.toMillis(), own.start.toMillis());
          const overlapEndMs = Math.min(occ.end.toMillis(), own.end.toMillis());
          const overlapMin = Math.round((overlapEndMs - overlapStartMs) / 60000);
          if(overlapMin > 0) overlaps.push({ id: peer.id, name: peer.name, meeting: m, occ, overlapMin });
        });
        overlaps.sort((a,b)=> b.overlapMin - a.overlapMin);

        if(!overlaps.length){
          listEl.innerHTML = `<div class="empty">No other groups at your level currently overlap with your meeting time.</div>`;
        } else {
          listEl.style.cssText = 'display:flex;gap:12px;overflow-x:auto;padding-bottom:6px;';
          listEl.innerHTML = overlaps.map(o=>{
            const yourStart = o.occ.start.setZone(own.start.zoneName);
            const yourEnd = o.occ.end.setZone(own.start.zoneName);
            const sameZone = own.start.zoneName === o.occ.start.zoneName;
            const timeLabel = `${yourStart.toFormat('h:mma')}–${yourEnd.toFormat('h:mma')}`;
            const theirLabel = sameZone ? 'same time zone as you' : `${o.occ.start.toFormat('h:mma')}–${o.occ.end.toFormat('h:mma')} their time`;
            const rel = relByPeer[o.id];
            let actionHtml;
            if(!rel){
              actionHtml = `<button class="btn brass" data-req="${o.id}" data-name="${esc(o.name)}" style="font-size:11px;padding:5px 9px;margin-top:6px;">Become sisters</button>`;
            } else if(rel.status==='confirmed'){
              actionHtml = `<span style="display:inline-block;background:#DDEAE0;color:#2E6B44;border-radius:10px;padding:2px 8px;font-size:10.5px;font-weight:600;margin-top:6px;">Sister division</span>`;
            } else if(rel.status==='pending' && rel.iAmNodeA){
              actionHtml = `<span style="display:inline-block;background:#F2E9D3;color:#8A6A24;border-radius:10px;padding:2px 8px;font-size:10.5px;font-weight:600;margin-top:6px;">Request sent</span>`;
            } else if(rel.status==='pending' && !rel.iAmNodeA){
              actionHtml = `<button class="btn brass" data-respond="${rel.id}" data-name="${esc(o.name)}" style="font-size:11px;padding:5px 9px;margin-top:6px;">Respond to request</button>`;
            } else {
              actionHtml = `<span style="font-size:10.5px;color:var(--ink-soft);margin-top:6px;display:inline-block;">Declined</span>`;
            }
            return `
              <div style="flex:none;width:200px;background:var(--card);border:1px solid var(--stone-line);border-radius:6px;padding:13px 14px;">
                <div style="font-size:12.5px;font-weight:600;margin-bottom:2px;">${esc(o.name)}
                  <span style="display:inline-block;background:#F2E4C6;color:#8A6A24;border-radius:10px;padding:1px 7px;font-size:10px;font-weight:600;margin-left:4px;">${o.overlapMin} min</span>
                </div>
                <div style="font-size:12px;font-weight:600;margin:5px 0 1px;">${timeLabel}</div>
                <div style="font-size:10.5px;color:var(--ink-soft);margin-bottom:6px;">${esc(theirLabel)}</div>
                <div style="font-size:11px;color:var(--ink-soft);">${esc(o.meeting.address || 'No address on file')}</div>
                ${actionHtml}
              </div>`;
          }).join('');

          listEl.querySelectorAll('[data-req]').forEach(btn=>{
            btn.onclick = ()=> openSisterRequestModal(btn.dataset.req, btn.dataset.name, onDone);
          });
          listEl.querySelectorAll('[data-respond]').forEach(btn=>{
            btn.onclick = ()=> openRespondModal(btn.dataset.respond, btn.dataset.name, onDone);
          });
        }
      }
    }

    await renderMySisterDivisions(deepest, onDone);
  }

  // ---------- Library: org-wide search over sessions with a recording attached ----------
  async function renderLibrary(){
    const box = document.getElementById('libraryMount');
    if(!box) return;
    box.innerHTML = `
      <div style="margin-top:26px;background:var(--night);border-radius:6px;padding:16px 20px;margin-bottom:14px;">
        <h2 class="serif" style="font-size:17px;font-weight:500;margin:0 0 4px;color:#fff;">Library</h2>
        <p style="font-size:12px;color:#B7CFC9;margin:0;">Every talk across the organisation with a recording attached.</p>
      </div>
      <div style="border:1px solid var(--stone-line);border-radius:6px;background:var(--card);padding:16px 18px;">
        <input type="text" id="libSearch" placeholder="Search by title, presenter, or keyword…" style="width:100%;max-width:420px;padding:9px 11px;border:1px solid var(--stone-line);border-radius:5px;font-size:13.5px;font-family:inherit;box-sizing:border-box;margin-bottom:4px;">
        <div id="libResults" class="loading">Loading…</div>
      </div>
    `;
    async function runSearch(q){
      const results = document.getElementById('libResults');
      results.innerHTML = `<div class="loading">Searching…</div>`;
      const { data, error } = await sb.rpc('search_library', { p_query: q || '' });
      if(error){ results.innerHTML = `<div class="err">${esc(error.message)}</div>`; return; }
      if(!data || !data.length){ results.innerHTML = `<div class="empty">No recordings found${q ? ' for "'+esc(q)+'"' : ' yet'}.</div>`; return; }
      results.className = '';
      results.innerHTML = data.map(r=>{
        const dateLabel = DateTime.fromISO(r.session_date).toFormat('d LLL yyyy');
        const kw = (r.keywords||[]).map(k=>`<span style="display:inline-block;background:var(--stone);border-radius:10px;padding:1px 8px;font-size:10px;color:var(--ink-soft);margin-right:4px;">${esc(k)}</span>`).join('');
        return `<div style="display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px 0;border-top:1px solid var(--stone-line);">
          <div>
            <div style="font-size:13.5px;font-weight:600;">${esc(r.topic||'Untitled session')}</div>
            <div style="font-size:11.5px;color:var(--ink-soft);margin-top:2px;">${r.presenter ? esc(r.presenter)+' · ' : ''}${esc(r.division_name)} · ${dateLabel}</div>
            <div style="margin-top:6px;">${kw}</div>
          </div>
          <a href="${esc(r.recording_url)}" target="_blank" rel="noopener" style="flex:none;display:inline-flex;align-items:center;gap:6px;background:var(--night);color:#fff;border-radius:5px;padding:7px 14px;font-size:12px;font-weight:600;text-decoration:none;">
            <svg viewBox="0 0 24 24" width="12" height="12" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>Watch
          </a>
        </div>`;
      }).join('');
    }
    let debounceTimer;
    document.getElementById('libSearch').addEventListener('input', e=>{
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(()=> runSearch(e.target.value.trim()), 250);
    });
    runSearch('');
  }

  // ---------- Keyword Alerts: subscribe, then search for matching talks org-wide ----------
  async function renderKeywordAlerts(){
    const box = document.getElementById('keywordMount');
    if(!box) return;
    box.innerHTML = `
      <div style="margin-top:26px;background:var(--night);border-radius:6px;padding:16px 20px;margin-bottom:14px;">
        <h2 class="serif" style="font-size:17px;font-weight:500;margin:0 0 4px;color:#fff;">Keyword alerts</h2>
        <p style="font-size:12px;color:#B7CFC9;margin:0;">Enter keywords for topics you're interested in — we'll show matching talks, and email you as new ones appear.</p>
      </div>
      <div style="border:1px solid var(--stone-line);border-radius:6px;background:var(--card);padding:16px 18px;margin-bottom:14px;">
        <div id="kwChips" style="display:flex;gap:7px;flex-wrap:wrap;margin-bottom:10px;"></div>
        <div style="display:flex;gap:6px;max-width:360px;">
          <input type="text" id="kwInput" placeholder="Add a keyword…" style="flex:1;padding:8px 10px;border:1px solid var(--stone-line);border-radius:5px;font-family:inherit;font-size:13px;">
          <button id="kwAddBtn" style="background:var(--brass);color:var(--night-deep);border:none;border-radius:5px;padding:0 14px;font-size:12.5px;font-weight:600;cursor:pointer;">Add</button>
        </div>
      </div>
      <div style="border:1px solid var(--stone-line);border-radius:6px;background:var(--card);padding:16px 18px;">
        <div id="kwResults" class="loading">Loading…</div>
      </div>
    `;

    async function loadChipsAndResults(){
      const { data: rows, error } = await sb.from('keyword_alerts').select('keyword').order('keyword');
      const chipsEl = document.getElementById('kwChips');
      if(error){ chipsEl.innerHTML = `<div class="err">${esc(error.message)}</div>`; return; }
      const keywords = (rows||[]).map(r=>r.keyword);
      chipsEl.innerHTML = keywords.length
        ? keywords.map(k=>`<span style="background:var(--night);color:#fff;border-radius:14px;padding:5px 8px 5px 12px;font-size:12px;display:inline-flex;align-items:center;gap:6px;">${esc(k)}<button data-remove="${esc(k)}" style="background:none;border:none;color:#9FADA7;font-size:13px;cursor:pointer;padding:0;">&times;</button></span>`).join('')
        : `<span style="font-size:12px;color:var(--ink-soft);">No keywords yet — add one below.</span>`;
      chipsEl.querySelectorAll('[data-remove]').forEach(btn=>{
        btn.onclick = async ()=>{
          await sb.rpc('remove_keyword_alert', { p_keyword: btn.dataset.remove });
          loadChipsAndResults();
        };
      });

      const results = document.getElementById('kwResults');
      if(!keywords.length){ results.innerHTML = `<div class="empty">Add a keyword above to see matching talks.</div>`; return; }
      results.innerHTML = `<div class="loading">Searching…</div>`;
      const { data: matches, error: matchErr } = await sb.rpc('search_keyword_matches');
      if(matchErr){ results.innerHTML = `<div class="err">${esc(matchErr.message)}</div>`; return; }
      if(!matches || !matches.length){ results.innerHTML = `<div class="empty">No talks match your keywords yet.</div>`; return; }
      results.className = '';
      results.innerHTML = matches.map(m=>{
        const dateLabel = DateTime.fromISO(m.session_date).toFormat('d LLL yyyy');
        return `<div style="display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px 0;border-top:1px solid var(--stone-line);">
          <div>
            <div style="font-size:13.5px;font-weight:600;">${esc(m.topic)}</div>
            <div style="font-size:11.5px;color:var(--ink-soft);margin-top:2px;">${m.presenter ? esc(m.presenter)+' · ' : ''}${esc(m.division_name)} · ${dateLabel}</div>
            <div style="margin-top:5px;"><span style="display:inline-block;background:#F2E4C6;color:#8A6A24;border-radius:10px;padding:2px 8px;font-size:10.5px;font-weight:600;">matches "${esc(m.matched_keyword)}"</span></div>
          </div>
          ${m.video_url ? `<a href="${esc(m.video_url)}" target="_blank" rel="noopener" style="flex:none;display:inline-flex;align-items:center;gap:6px;background:var(--brass);color:var(--night-deep);border-radius:5px;padding:7px 14px;font-size:12px;font-weight:600;text-decoration:none;"><svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 10.5V7a1 1 0 0 0-1-1H4a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-3.5l4 4v-11l-4 4z"/></svg>Join</a>` : ''}
        </div>`;
      }).join('');
    }

    document.getElementById('kwAddBtn').onclick = async ()=>{
      const inp = document.getElementById('kwInput');
      const val = inp.value.trim();
      if(!val) return;
      await sb.rpc('add_keyword_alert', { p_keyword: val });
      inp.value = '';
      loadChipsAndResults();
    };
    document.getElementById('kwInput').addEventListener('keydown', e=>{
      if(e.key==='Enter') document.getElementById('kwAddBtn').click();
    });

    loadChipsAndResults();
  }

  // ---------- Profile: your name, where you sit (read-only), and the contact toggle ----------
  function renderProfile(profile, nodePath){
    const box = document.getElementById('profileMount');
    if(!box) return;
    const breadcrumb = nodePath.map(n=>n.name).join(' → ');

    box.innerHTML = `
      <div style="margin-top:26px;background:var(--night);border-radius:6px;padding:16px 20px;margin-bottom:14px;">
        <h2 class="serif" style="font-size:17px;font-weight:500;margin:0 0 4px;color:#fff;">Profile</h2>
        <p style="font-size:12px;color:#B7CFC9;margin:0;">Your details, and how other groups can reach you.</p>
      </div>

      <div style="border:1px solid var(--stone-line);border-radius:6px;padding:16px 18px;background:var(--card);max-width:480px;">
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;">
            <div>
              <label style="display:block;font-size:11px;color:var(--ink-soft);margin-bottom:5px;">First name</label>
              <input type="text" id="pfFirst" value="${esc(profile.first_name||'')}" style="width:100%;padding:8px 10px;border:1px solid var(--stone-line);border-radius:5px;font-family:inherit;font-size:13px;box-sizing:border-box;">
            </div>
            <div>
              <label style="display:block;font-size:11px;color:var(--ink-soft);margin-bottom:5px;">Last name</label>
              <input type="text" id="pfLast" value="${esc(profile.last_name||'')}" style="width:100%;padding:8px 10px;border:1px solid var(--stone-line);border-radius:5px;font-family:inherit;font-size:13px;box-sizing:border-box;">
            </div>
          </div>

          <div style="margin-bottom:16px;">
            <label style="display:block;font-size:11px;color:var(--ink-soft);margin-bottom:4px;">Where you sit</label>
            <div style="font-size:13px;color:var(--ink);">${esc(breadcrumb)}</div>
            <div style="font-size:11px;color:var(--ink-soft);margin-top:3px;">To change this, contact an organisational-email member — position editing isn't self-service yet.</div>
          </div>

          <label style="display:flex;align-items:flex-start;gap:10px;cursor:pointer;margin-bottom:14px;">
            <span style="position:relative;flex:none;width:38px;height:21px;">
              <input type="checkbox" id="pfContact" ${profile.is_org_contact ? 'checked' : ''} style="position:absolute;opacity:0;width:1px;height:1px;">
              <span id="pfTrack" style="display:block;width:38px;height:21px;background:${profile.is_org_contact ? '#4B7B4E' : '#D9CFB7'};border-radius:11px;position:relative;transition:background 0.15s;">
                <span id="pfThumb" style="position:absolute;top:2px;left:${profile.is_org_contact ? '19px' : '2px'};width:17px;height:17px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,0.25);transition:left 0.15s;"></span>
              </span>
            </span>
            <span style="font-size:12.5px;color:var(--ink-soft);">
              <b style="color:var(--ink);">Happy to be an organisational contact?</b><br>
              Contacts may receive sister-division requests and joint-session notifications on behalf of ${esc(nodePath.length ? nodePath[nodePath.length-1].name : 'your group')}. You can turn this off anytime.
            </span>
          </label>

          <div id="pfErr" style="font-size:11.5px;color:var(--ember);min-height:14px;margin-bottom:6px;"></div>
          <button class="btn brass" id="pfSave">Save</button>
          <span id="pfSavedNote" style="font-size:12px;color:#2E6B44;margin-left:10px;display:none;">Saved</span>
      </div>
    `;

    document.getElementById('pfContact').addEventListener('change', function(){
      document.getElementById('pfTrack').style.background = this.checked ? '#4B7B4E' : '#D9CFB7';
      document.getElementById('pfThumb').style.left = this.checked ? '19px' : '2px';
    });

    document.getElementById('pfSave').onclick = async ()=>{
      const btn = document.getElementById('pfSave');
      btn.disabled = true; btn.textContent = 'Saving…';
      document.getElementById('pfSavedNote').style.display = 'none';
      const { error } = await sb.rpc('update_own_profile', {
        p_first_name: document.getElementById('pfFirst').value.trim(),
        p_last_name: document.getElementById('pfLast').value.trim(),
        p_is_org_contact: document.getElementById('pfContact').checked
      });
      btn.disabled = false; btn.textContent = 'Save';
      if(error){ document.getElementById('pfErr').textContent = error.message; return; }
      document.getElementById('pfSavedNote').style.display = 'inline';
      // Update local profile object + sidebar so the name change reflects immediately.
      profile.first_name = document.getElementById('pfFirst').value.trim();
      profile.last_name = document.getElementById('pfLast').value.trim();
      profile.is_org_contact = document.getElementById('pfContact').checked;
      renderSidebar(document.querySelector('.org-name') ? document.querySelector('.org-name').textContent : '', nodePath, profile);
    };
  }
