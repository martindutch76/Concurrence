  // Walks parent_id up from the user's node to the root, returning an
  // ordered array [national, state, region, division] for the breadcrumb.
  async function buildNodePath(nodeId){
    const path = [];
    let currentId = nodeId;
    let guard = 0;
    while(currentId && guard < 10){
      guard++;
      const { data: node } = await sb.from('hierarchy_nodes').select('id,name,parent_id,level_id,org_id').eq('id', currentId).maybeSingle();
      if(!node) break;
      path.unshift(node);
      currentId = node.parent_id;
    }
    return path;
  }

  // Finds the next date/time this recurring meeting falls on, in its own
  // timezone, correctly accounting for daylight saving via Luxon (no
  // hand-maintained offsets, no manual DST toggle to forget).
  function nextOccurrence(dayOfWeek, startTime, endTime, timezone){
    const targetIsoWeekday = dayOfWeek === 0 ? 7 : dayOfWeek; // Luxon: Mon=1..Sun=7
    const [sh, sm] = startTime.split(':').map(Number);
    const [eh, em] = endTime.split(':').map(Number);
    const now = DateTime.now().setZone(timezone);
    let candidate = now.set({ hour: sh, minute: sm, second: 0, millisecond: 0 });
    while(candidate.weekday !== targetIsoWeekday || candidate < now){
      candidate = candidate.plus({ days: 1 }).set({ hour: sh, minute: sm, second: 0, millisecond: 0 });
    }
    const end = candidate.set({ hour: eh, minute: em });
    return { start: candidate, end };
  }

  // Computes the occurrence on a SPECIFIC known date (no searching needed) —
  // used for month-browsing, where we already know which date we're on.
  function occurrenceOnDate(dateISO, startTime, endTime, timezone){
    const [sh, sm] = startTime.split(':').map(Number);
    const [eh, em] = endTime.split(':').map(Number);
    const start = DateTime.fromISO(dateISO, { zone: timezone }).set({ hour: sh, minute: sm, second: 0, millisecond: 0 });
    const end = start.set({ hour: eh, minute: em });
    return { start, end };
  }

  // Finds a peer's occurrence CLOSEST in absolute time to a given moment —
  // used for per-date concurrent overlap in month-browsing, where the peer's
  // own weekday may land on a different calendar date than ours, especially
  // once timezone shifts are accounted for.
  function occurrenceNearMoment(targetMoment, dayOfWeek, startTime, endTime, timezone){
    const targetIsoWeekday = dayOfWeek === 0 ? 7 : dayOfWeek;
    const [sh, sm] = startTime.split(':').map(Number);
    const [eh, em] = endTime.split(':').map(Number);
    let best = null, bestDiff = Infinity;
    for(let offset = -4; offset <= 4; offset++){
      const candidate = targetMoment.setZone(timezone).plus({ days: offset }).set({ hour: sh, minute: sm, second: 0, millisecond: 0 });
      if(candidate.weekday !== targetIsoWeekday) continue;
      const diff = Math.abs(candidate.toMillis() - targetMoment.toMillis());
      if(diff < bestDiff){ bestDiff = diff; best = candidate; }
    }
    if(!best) return null;
    return { start: best, end: best.set({ hour: eh, minute: em }) };
  }

  function icsHref(summary, location, dtStartUTC, dtEndUTC){
    const fmt = "yyyyMMdd'T'HHmmss'Z'";
    const lines = [
      'BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Concurrence//EN','BEGIN:VEVENT',
      `UID:${crypto.randomUUID()}@concurrence.app`,
      `DTSTART:${dtStartUTC.toFormat(fmt)}`,
      `DTEND:${dtEndUTC.toFormat(fmt)}`,
      `SUMMARY:${summary}`,
      `LOCATION:${location}`,
      'END:VEVENT','END:VCALENDAR'
    ].join('\r\n');
    return 'data:text/calendar;charset=utf8,' + encodeURIComponent(lines);
  }

  // Bulk program download: one .ics file covering every upcoming meeting
  // date over the next 6 months, using the real topic where one's been
  // set and skipping any date flagged as no-meeting.
  async function buildDivisionProgram(nodeId, orgLabel, meeting){
    const btn = document.getElementById('programBtn');
    if(btn){ btn.disabled = true; btn.textContent = 'Building…'; }
    try{
      const targetIsoWeekday = meeting.day_of_week === 0 ? 7 : meeting.day_of_week;
      const [sh, sm] = meeting.start_time.split(':').map(Number);
      const [eh, em] = meeting.end_time.split(':').map(Number);

      const today = DateTime.now().setZone(meeting.timezone);
      const horizon = today.plus({ months: 6 });

      const dates = [];
      let cursor = today.set({ hour: sh, minute: sm, second: 0, millisecond: 0 });
      while(cursor.weekday !== targetIsoWeekday) cursor = cursor.plus({ days: 1 });
      while(cursor <= horizon){
        dates.push(cursor);
        cursor = cursor.plus({ days: 7 });
      }

      if(!dates.length){
        alert('No upcoming meeting dates found in the next 6 months.');
        return;
      }

      const { data: sessions, error } = await sb.rpc('get_sessions_for_node', {
        check_node_id: nodeId, from_date: dates[0].toISODate(), to_date: dates[dates.length-1].toISODate()
      });
      if(error){ alert('Could not build your program: ' + error.message); return; }
      const byDate = {};
      (sessions||[]).forEach(s=> byDate[s.session_date] = s);

      const fmt = "yyyyMMdd'T'HHmmss'Z'";
      const events = [];
      dates.forEach(dt=>{
        const iso = dt.toISODate();
        const s = byDate[iso];
        if(s && s.no_meeting) return; // deliberately skipped, not just blank
        const startUTC = dt.toUTC();
        const endUTC = dt.set({ hour: eh, minute: em }).toUTC();
        const topic = (s && s.topic) ? s.topic : `${orgLabel} meeting`;
        events.push([
          'BEGIN:VEVENT',
          `UID:${crypto.randomUUID()}@concurrence.app`,
          `DTSTART:${startUTC.toFormat(fmt)}`,
          `DTEND:${endUTC.toFormat(fmt)}`,
          `SUMMARY:${orgLabel} — ${topic}`,
          `LOCATION:${meeting.address || ''}`,
          'END:VEVENT'
        ].join('\r\n'));
      });

      const ics = ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Concurrence//EN', ...events, 'END:VCALENDAR'].join('\r\n');
      const blob = new Blob([ics], { type: 'text/calendar;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `${orgLabel.replace(/[^a-z0-9]+/gi,'-')}-program.ics`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
    } finally {
      if(btn){ btn.disabled = false; btn.textContent = 'Download up-to-date program'; }
    }
  }

  // Attaches Google's real Places Autocomplete to an address input. The
  // Maps JS script loads async in <head>, so this retries briefly in case
  // a modal opens before it's ready, rather than failing silently.
  function attachPlacesAutocomplete(inputEl, attempt){
    attempt = attempt || 0;
    if(window.google && window.google.maps && window.google.maps.places){
      new google.maps.places.Autocomplete(inputEl, { types: ['geocode'] });
      return;
    }
    if(attempt < 20) setTimeout(()=> attachPlacesAutocomplete(inputEl, attempt+1), 250);
    else console.warn('Google Places did not load in time — address field will work as plain text.');
  }

            <div class="when serif">${esc(whenLabel)}</div>

          </div>
        </div>

          <a class="btn brass" href="${href}" download="${summary.replace(/[^a-z0-9]+/gi,'-')}.ics">Add to calendar</a>

      <div id="monthMount" style="margin-top:26px;"></div>

        p_keywords: noMeeting ? [] : back.querySelector('#sKeywords').value.split(',').map(x=>x.trim()).filter(Boolean),

        p_access_code: noMeeting ? null : (back.querySelector('#sAccessCode').value.trim() || null)
      });
      if(error){
        back.querySelector('#sErr').textContent = error.message;
        btn.disabled=false; btn.textContent='Save'; return;
      }
      const contactRequestId = saveResult && saveResult[0] && saveResult[0].contact_request_id;
      if(contactRequestId){
        // A new joint pairing was flagged — notify the partner division.
        // Fire-and-forget: the session itself is already saved regardless.
        sb.functions.invoke('notify-request', { body: { contactRequestId } })
          .catch(err => console.error('Joint session notification failed to send:', err));
      }
      back.remove();
      onSaved();
    };
  }

  async function renderMySisterDivisions(deepest, onDone){
    const mount = document.getElementById('sisterMount');
    if(!mount) return;
    const { data: rels, error } = await sb.from('sister_relationships')
      .select('id,node_a,node_b,status')
      .or(`node_a.eq.${deepest.id},node_b.eq.${deepest.id}`);
    if(error){ mount.innerHTML = `<div class="err">${esc(error.message)}</div>`; return; }
    if(!rels || !rels.length){ mount.innerHTML=''; return; }

    const peerIds = rels.map(r=> r.node_a===deepest.id ? r.node_b : r.node_a);
    const { data: peerNodes } = await sb.from('hierarchy_nodes').select('id,name').in('id', peerIds);
    const nameOf = id => { const n = (peerNodes||[]).find(p=>p.id===id); return n ? n.name : 'Unknown group'; };

    const confirmed = rels.filter(r=>r.status==='confirmed');
    const pendingForMe = rels.filter(r=>r.status==='pending' && r.node_b===deepest.id);

    let html = '';
    if(pendingForMe.length){
      html += `<h2 class="serif" style="font-size:17px;font-weight:500;margin:0 0 8px;">Sister division requests</h2>`;
      html += pendingForMe.map(r=>{
        const peerId = r.node_a===deepest.id ? r.node_b : r.node_a;
        return `<div style="background:var(--card);border:1px solid var(--stone-line);border-radius:6px;padding:12px 14px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:10px;">

          <button class="btn brass" data-respond2="${r.id}" data-name2="${esc(nameOf(peerId))}" style="font-size:11px;padding:6px 10px;flex:none;">Respond</button>
        </div>`;
      }).join('');
    }
    if(confirmed.length){
      html += `<h2 class="serif" style="font-size:17px;font-weight:500;margin:18px 0 8px;">My sister divisions</h2>`;
      html += `<div style="display:flex;gap:12px;flex-wrap:wrap;">` + confirmed.map(r=>{
        const peerId = r.node_a===deepest.id ? r.node_b : r.node_a;
        return `<div style="background:var(--card);border:1px solid var(--stone-line);border-radius:6px;padding:12px 14px;min-width:180px;">
          <div style="font-size:13px;font-weight:600;">${esc(nameOf(peerId))}</div>

    mount.querySelectorAll('[data-respond2]').forEach(btn=>{

    });

  // ---------- Profile: your name, where you sit (read-only), and the contact toggle ----------
  // Cascading level-by-level selector for changing your own position —
  // only ever points at EXISTING nodes; creating new ones stays restricted
  // to the domain-approved onboarding flow.
  async function renderPositionEditor(orgId){
    const editor = document.getElementById('pfPosEditor');
    if(!editor) return;
    editor.style.display = 'block';
    editor.innerHTML = `<div class="loading" style="padding:10px 0;">Loading organisation structure…</div>`;

    const { data: levels, error } = await sb.from('hierarchy_levels').select('id,level_index,name').eq('org_id', orgId).order('level_index');
    if(error || !levels || !levels.length){ editor.innerHTML = `<div class="err">Could not load organisation structure.</div>`; return; }

    const selectedIds = {}; // level.id -> node id chosen so far

    async function renderLevelRow(levelIdx){
      // Remove this level's row and anything after it (a change higher up invalidates lower selections).
      levels.slice(levelIdx).forEach(l=> delete selectedIds[l.id]);
      editor.querySelectorAll(`[data-level-row]`).forEach(row=>{
        if(parseInt(row.dataset.levelRow,10) >= levelIdx) row.remove();
      });
      document.getElementById('posSaveRow')?.remove();

      if(levelIdx >= levels.length){
        // Every level has a selection — show the save action.
        const deepestLevel = levels[levels.length-1];
        const finalId = selectedIds[deepestLevel.id];
        const saveRow = document.createElement('div');
        saveRow.id = 'posSaveRow';
        saveRow.style.marginTop = '10px';
        saveRow.innerHTML = `
          <div id="posErr" style="font-size:11px;color:var(--ember);min-height:14px;margin-bottom:5px;"></div>
          <button class="btn brass" id="posSaveBtn" style="font-size:12px;padding:7px 14px;">Move to this position</button>
        `;
        editor.appendChild(saveRow);
        document.getElementById('posSaveBtn').onclick = async ()=>{
          const btn = document.getElementById('posSaveBtn'); btn.disabled = true; btn.textContent = 'Saving…';
          const { error: posErr } = await sb.rpc('update_own_position', { p_node_id: finalId });
          if(posErr){ document.getElementById('posErr').textContent = posErr.message; btn.disabled = false; btn.textContent = 'Move to this position'; return; }
          window.__refreshDashboard();
        };
        return;
      }

      const level = levels[levelIdx];
      const parentLevel = levelIdx > 0 ? levels[levelIdx-1] : null;
      const parentId = parentLevel ? selectedIds[parentLevel.id] : null;
      if(parentLevel && !parentId) return; // wait until parent is chosen

      let query = sb.from('hierarchy_nodes').select('id,name').eq('org_id', orgId).eq('level_id', level.id);
      query = parentId ? query.eq('parent_id', parentId) : query.is('parent_id', null);
      const { data: options } = await query.order('name');

      const row = document.createElement('div');
      row.dataset.levelRow = levelIdx;
      row.style.marginBottom = '8px';
      row.innerHTML = `
        <label style="display:block;font-size:10.5px;color:var(--ink-soft);margin-bottom:3px;">${esc(level.name)}</label>
        <select style="width:100%;padding:7px 9px;border:1px solid var(--stone-line);border-radius:5px;font-family:inherit;font-size:12.5px;">
          <option value="">Select ${esc(level.name)}…</option>
          ${(options||[]).map(o=>`<option value="${o.id}">${esc(o.name)}</option>`).join('')}
        </select>
      `;
      editor.appendChild(row);
      row.querySelector('select').addEventListener('change', function(){
        selectedIds[level.id] = this.value || null;
        renderLevelRow(levelIdx + 1);
      });
    }

    editor.innerHTML = '';
    await renderLevelRow(0);
  }

  // ---------- Other Events: one-off sessions from ancestor nodes (Region/State/National) ----------
  async function renderOtherEvents(){
    const box = document.getElementById('otherEventsMount');
    if(!box) return;
    const nodePath = window.__nodePath || [];
    const isApproved = !!window.__isApproved;
    const deepest = nodePath.length ? nodePath[nodePath.length-1] : null;
    // Ancestor nodes only — Region, State, National — not the viewer's own division.
    const ancestorNodes = nodePath.slice(0, -1);

    box.innerHTML = `
      <div style="background:var(--night);border-radius:6px;padding:16px 20px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;">

          <h2 class="serif" style="font-size:17px;font-weight:500;margin:0 0 4px;color:#fff;">Other Events</h2>
          <p style="font-size:12px;color:#B7CFC9;margin:0;">One-off sessions from your Region, State and National bodies.</p>
        </div>
        ${isApproved && ancestorNodes.length ? '<button class="btn brass" id="addEventBtn">+ Add event</button>' : ''}
      </div>
      <div id="eventsList" class="loading">Loading…</div>
    `;

    if(isApproved && ancestorNodes.length){
      document.getElementById('addEventBtn').onclick = ()=> openEventModal(ancestorNodes, deepest, ()=> renderOtherEvents());
    }

    const listEl = document.getElementById('eventsList');
    if(!ancestorNodes.length){
      listEl.innerHTML = `<div class="empty">Your group is at the top of the hierarchy, so there's no higher-level body to show events from.</div>`;
      return;
    }

    const { data: events, error } = await sb.rpc('get_special_events_for_nodes', { p_node_ids: ancestorNodes.map(n=>n.id) });
    if(error){ listEl.innerHTML = `<div class="err">${esc(error.message)}</div>`; return; }
    if(!events || !events.length){ listEl.innerHTML = `<div class="empty">No upcoming events from your Region, State or National body yet.</div>`; return; }

    const eventEditorIds = [...new Set(events.filter(e=>e.edited_by).map(e=>e.edited_by))];
    let eventEditorMap = {};
    if(eventEditorIds.length){
      const { data: editors } = await sb.from('profiles').select('id,first_name,last_name').in('id', eventEditorIds);
      (editors||[]).forEach(e=> eventEditorMap[e.id] = `${e.first_name} ${e.last_name}`);
    }

    listEl.innerHTML = events.map(ev=>{
      const dateLabel = DateTime.fromISO(ev.event_date).toFormat('cccc d LLL yyyy');
      const timeLabel = ev.start_time ? `${ev.start_time.slice(0,5)}${ev.end_time ? '–'+ev.end_time.slice(0,5) : ''} (${ev.timezone})` : '';
      const kw = (ev.keywords||[]).map(k=>`<span style="display:inline-block;background:var(--stone);border-radius:10px;padding:1px 8px;font-size:10px;color:var(--ink-soft);margin-right:4px;">${esc(k)}</span>`).join('');
      const evEditLine = formatEditedBySync(ev.edited_by, ev.edited_at, eventEditorMap);
      return `
        <div style="background:var(--card);border:1px solid var(--stone-line);border-radius:6px;padding:16px 18px;margin-bottom:10px;">
          <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;">
            <div>
              <div style="font-size:10.5px;color:var(--brass);font-weight:700;text-transform:uppercase;margin-bottom:3px;">${esc(ev.division_name)}</div>
              <div style="font-size:14px;font-weight:600;">${esc(ev.title)}</div>
              <div style="font-size:12px;color:var(--ink-soft);margin-top:3px;">${esc(dateLabel)}${timeLabel ? ' · '+esc(timeLabel) : ''}</div>
              ${ev.address ? `<div style="font-size:12px;color:var(--ink-soft);margin-top:2px;">${esc(ev.address)}</div>` : ''}
              <div style="margin-top:6px;">${kw}</div>
              ${evEditLine}
            </div>
            <div style="display:flex;flex-direction:column;gap:6px;align-items:flex-end;flex:none;">
              ${ev.video_url ? `<a href="${esc(ev.video_url)}" target="_blank" rel="noopener" style="display:inline-flex;align-items:center;gap:6px;background:var(--night);color:#fff;border-radius:5px;padding:7px 14px;font-size:12px;font-weight:600;text-decoration:none;"><svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 10.5V7a1 1 0 0 0-1-1H4a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-3.5l4 4v-11l-4 4z"/></svg>Join</a>` : ''}
              ${ev.access_code ? `<div style="font-size:10.5px;color:var(--ink-soft);">Code: <b style="color:var(--ink);">${esc(ev.access_code)}</b></div>` : ''}
              ${isApproved ? `<button data-del="${ev.id}" style="background:none;border:none;color:var(--ember);font-size:11px;text-decoration:underline;cursor:pointer;padding:0;">Remove</button>` : ''}
            </div>
          </div>
        </div>`;
    }).join('');

    if(isApproved){
      listEl.querySelectorAll('[data-del]').forEach(btn=>{
        btn.onclick = async ()=>{
          if(!confirm('Remove this event for everyone who can see it?')) return;
          const { error: delErr } = await sb.rpc('delete_special_event', { p_id: btn.dataset.del });
          if(delErr){ alert(delErr.message); return; }
          renderOtherEvents();
        };
      });
    }
  }

  // ---------- Month browsing: every meeting-date in a given month, past or future ----------
  async function renderSessionMonth(nodeId, orgLabel, meeting, isApproved){
    const box = document.getElementById('monthMount');
    if(!box) return;
    const nodePath = window.__nodePath || [];
    const deepest = nodePath.length ? nodePath[nodePath.length-1] : null;
    const refreshMonth = ()=> renderSessionMonth(nodeId, orgLabel, meeting, isApproved);

    const monthLabel = DateTime.local(sessionViewYear, sessionViewMonth, 1).toFormat('LLLL yyyy');
    box.innerHTML = `
      <div style="display:flex;justify-content:flex-end;align-items:center;gap:10px;margin-bottom:12px;">
        <button id="monthPrev" style="background:#fff;border:1px solid var(--stone-line);width:26px;height:26px;border-radius:5px;font-size:15px;line-height:1;cursor:pointer;">‹</button>
        <span class="serif" style="font-size:14px;min-width:120px;text-align:center;">${monthLabel}</span>
        <button id="monthNext" style="background:#fff;border:1px solid var(--stone-line);width:26px;height:26px;border-radius:5px;font-size:15px;line-height:1;cursor:pointer;">›</button>
      </div>
      <div style="display:flex;gap:14px;margin-bottom:14px;align-items:stretch;">
        <div style="flex:none;width:230px;background:#fff;border:1px solid var(--stone-line);border-radius:6px;padding:16px;display:flex;align-items:center;gap:11px;">
          ${markSvg(28)}
          <h2 class="serif" style="font-size:15px;font-weight:500;margin:0;white-space:nowrap;">My Meeting</h2>
        </div>
        <div style="flex:1;min-width:0;background:var(--night);color:#fff;border-radius:6px;padding:16px 20px;display:flex;align-items:center;gap:13px;">
          ${markSvg(28)}
          <h2 class="serif" style="font-size:17px;font-weight:500;margin:0;color:#fff;">Concurrent Meetings</h2>
        </div>
      </div>
      <div id="monthRows" class="loading">Loading month…</div>
    `;

    document.getElementById('monthPrev').onclick = ()=>{
      sessionViewMonth--; if(sessionViewMonth < 1){ sessionViewMonth = 12; sessionViewYear--; }
      refreshMonth();
    };
    document.getElementById('monthNext').onclick = ()=>{
      sessionViewMonth++; if(sessionViewMonth > 12){ sessionViewMonth = 1; sessionViewYear++; }
      refreshMonth();
    };

    const targetIsoWeekday = meeting.day_of_week === 0 ? 7 : meeting.day_of_week;
    const monthStart = DateTime.local(sessionViewYear, sessionViewMonth, 1);
    const daysInMonth = monthStart.daysInMonth;
    const dates = [];
    for(let d=1; d<=daysInMonth; d++){
      const dt = DateTime.local(sessionViewYear, sessionViewMonth, d);
      if(dt.weekday === targetIsoWeekday) dates.push(dt);
    }

    const rowsEl = document.getElementById('monthRows');
    if(!dates.length){
      rowsEl.innerHTML = `<div class="empty">Your group doesn't meet on this weekday, so there's nothing to show for ${monthLabel}.</div>`;
      return;
    }

    const fromDate = dates[0].toISODate();
    const toDate = dates[dates.length-1].toISODate();
    const { data: mySessions, error } = await sb.rpc('get_sessions_for_node', {
      check_node_id: nodeId, from_date: fromDate, to_date: toDate
    });
    if(error){ rowsEl.innerHTML = `<div class="err">${esc(error.message)}</div>`; return; }
    const myByDate = {};
    (mySessions||[]).forEach(s=> myByDate[s.session_date] = s);

    const editorIds = [...new Set((mySessions||[]).filter(s=>s.edited_by).map(s=>s.edited_by))];
    let editorNameMap = {};
    if(editorIds.length){
      const { data: editors } = await sb.from('profiles').select('id,first_name,last_name').in('id', editorIds);
      (editors||[]).forEach(e=> editorNameMap[e.id] = `${e.first_name} ${e.last_name}`);
    }

    // Peers at the same level, for per-date concurrent overlap.
    let peers = [], peerMeetings = [], relByPeer = {}, peerSessions = [];
    if(deepest){
      const { data: peerNodes } = await sb.from('hierarchy_nodes').select('id,name')
        .eq('org_id', deepest.org_id).eq('level_id', deepest.level_id).neq('id', deepest.id);
      peers = peerNodes || [];
      if(peers.length){
        const { data: pm } = await sb.from('meetings')
          .select('node_id, day_of_week, start_time, end_time, timezone, address')
          .in('node_id', peers.map(p=>p.id));
        peerMeetings = pm || [];

        const { data: rels } = await sb.from('sister_relationships')
          .select('id,node_a,node_b,status')
          .or(`node_a.eq.${deepest.id},node_b.eq.${deepest.id}`);
        (rels||[]).forEach(r=>{
          const peerId = r.node_a === deepest.id ? r.node_b : r.node_a;
          relByPeer[peerId] = { id: r.id, status: r.status, iAmNodeA: r.node_a === deepest.id };
        });

        // Widened by 4 days each side so a peer occurrence shifted onto a
        // different calendar date by timezone is still caught.
        const rangeStart = dates[0].minus({ days: 4 }).toISODate();
        const rangeEnd = dates[dates.length-1].plus({ days: 4 }).toISODate();
        const { data: ps } = await sb.from('sessions')
          .select('node_id, session_date, topic, presenter, joint_with_node, in_person, video_url')
          .in('node_id', peers.map(p=>p.id))
          .gte('session_date', rangeStart).lte('session_date', rangeEnd);
        peerSessions = ps || [];
      }
    }

    const todayIso = DateTime.now().toISODate();

    rowsEl.className = '';
    rowsEl.innerHTML = dates.map(dt=>{
      const iso = dt.toISODate();
      const s = myByDate[iso];
      const isToday = iso === todayIso;
      const dayNum = dt.toFormat('d');
      const monAbbr = dt.toFormat('LLL').toUpperCase();

      let anchorBody, anchorClass = '';
      if(s && s.no_meeting){
        anchorClass = 'no-meeting-card';
        anchorBody = `<div style="font-weight:600;font-size:13px;color:var(--ink-soft);">No meeting${s.no_meeting_reason ? ' — '+esc(s.no_meeting_reason) : ''}</div>`;
      } else if(s && s.topic){
        const joint = s.joint_with_node ? `<div style="font-size:9.5px;font-weight:700;color:#7C5CB8;margin-bottom:2px;">JOINT SESSION</div>` : '';
        anchorBody = `${joint}<div style="font-size:13px;font-weight:600;">${esc(s.topic)}</div><div style="font-size:11px;color:var(--ink-soft);margin-top:2px;">${s.presenter?esc(s.presenter):''}</div><div class="icon-badge-row" style="margin-top:6px;">${inPersonBadge(!!s.in_person)}${videoBadge(!!s.video_url, s.video_url)}</div>${s.access_code ? `<div style="font-size:10px;color:var(--ink-soft);margin-top:5px;">Code: <b style="color:var(--ink);">${esc(s.access_code)}</b></div>` : ''}`;
      } else {
        anchorBody = `<div style="font-size:12px;color:var(--ink-soft);">No topic set yet.</div>`;
      }
      const editBtn = isApproved ? editIconBtnAttr('edit-date', iso, 'position:absolute;top:10px;right:10px;width:26px;height:26px;') : '';
      const tileEditLine = formatEditedBySync(s && s.edited_by, s && s.edited_at, editorNameMap);

      const anchorHtml = `
        <div class="${anchorClass}" style="position:relative;flex:none;width:230px;background:var(--card);border:1px solid var(--stone-line);border-radius:6px;padding:13px 14px;">
          ${editBtn}
          <div style="display:flex;align-items:baseline;gap:7px;margin-bottom:8px;padding-right:${isApproved ? '30px' : '0'};">
            <span style="font-size:20px;font-weight:600;line-height:1;">${dayNum}</span>
            <span style="font-size:10.5px;color:var(--ink-soft);text-transform:uppercase;">${monAbbr}</span>
            ${isToday ? '<span style="font-size:9px;background:var(--brass);color:var(--night-deep);border-radius:8px;padding:1px 6px;font-weight:700;margin-left:auto;">TODAY</span>' : ''}
          </div>
          ${anchorBody}
          ${tileEditLine}
        </div>`;

      const myOcc = occurrenceOnDate(iso, meeting.start_time, meeting.end_time, meeting.timezone);
      const peerCards = [];
      peerMeetings.forEach(pm=>{
        const peer = peers.find(p=>p.id===pm.node_id);
        if(!peer) return;
        const peerOcc = occurrenceNearMoment(myOcc.start, pm.day_of_week, pm.start_time, pm.end_time, pm.timezone);
        if(!peerOcc) return;
        const overlapStart = Math.max(peerOcc.start.toMillis(), myOcc.start.toMillis());
        const overlapEnd = Math.min(peerOcc.end.toMillis(), myOcc.end.toMillis());
        const overlapMin = Math.round((overlapEnd - overlapStart) / 60000);
        if(overlapMin <= 0) return;

        const peerDateIso = peerOcc.start.toISODate();
        const peerSession = peerSessions.find(ps=> ps.node_id===pm.node_id && ps.session_date===peerDateIso);
        const rel = relByPeer[pm.node_id];
        const yourStart = peerOcc.start.setZone(meeting.timezone);
        const yourEnd = peerOcc.end.setZone(meeting.timezone);
        const sameZone = meeting.timezone === pm.timezone;
        const timeLabel = `${yourStart.toFormat('h:mma')}–${yourEnd.toFormat('h:mma')}`;
        const theirLabel = sameZone ? 'same time zone as you' : `${peerOcc.start.toFormat('h:mma')}–${peerOcc.end.toFormat('h:mma')} their time`;

        let actionHtml;
        if(!rel) actionHtml = `<button class="btn brass" data-req="${pm.node_id}" data-name="${esc(peer.name)}" style="font-size:11px;padding:5px 9px;margin-top:6px;">Become sisters</button>`;
        else if(rel.status==='confirmed') actionHtml = `<div style="margin-top:6px;display:flex;align-items:center;"><span style="display:inline-block;background:#DDEAE0;color:#2E6B44;border-radius:10px;padding:2px 8px;font-size:10.5px;font-weight:600;">Sister division</span>${messageIconBtn(pm.node_id, peer.name)}</div>`;
        else if(rel.status==='pending' && rel.iAmNodeA) actionHtml = `<span style="display:inline-block;background:#F2E9D3;color:#8A6A24;border-radius:10px;padding:2px 8px;font-size:10.5px;font-weight:600;margin-top:6px;">Request sent</span>`;
        else if(rel.status==='pending' && !rel.iAmNodeA) actionHtml = `<button class="btn brass" data-respond="${rel.id}" data-name="${esc(peer.name)}" style="font-size:11px;padding:5px 9px;margin-top:6px;">Respond to request</button>`;
        else actionHtml = `<span style="font-size:10.5px;color:var(--ink-soft);margin-top:6px;display:inline-block;">Declined</span>`;

        const isJointWithMe = !!(peerSession && peerSession.joint_with_node === nodeId);
        const topicLine = peerSession && peerSession.topic
          ? `${isJointWithMe?'Joint: ':'Next: '}<b>${esc(peerSession.topic)}</b>`
          : `No topic published yet`;
        const peerBadges = peerSession ? `<div class="icon-badge-row" style="margin-top:5px;">${inPersonBadge(!!peerSession.in_person)}${videoBadge(!!peerSession.video_url, peerSession.video_url)}</div>` : '';
        const cardStyle = isJointWithMe
          ? 'flex:none;width:180px;background:#FAF7FE;border:1px solid #B7A0DE;border-radius:6px;padding:11px 12px;'
          : 'flex:none;width:180px;background:var(--card);border:1px solid var(--stone-line);border-radius:6px;padding:11px 12px;';

        peerCards.push(`
          <div style="${cardStyle}">
            <div style="font-size:12px;font-weight:600;margin-bottom:2px;">${esc(peer.name)}<span style="display:inline-block;background:#F2E4C6;color:#8A6A24;border-radius:10px;padding:1px 6px;font-size:9.5px;font-weight:600;margin-left:4px;">${overlapMin} min</span></div>
            <div style="font-size:11.5px;font-weight:600;margin:4px 0 1px;">${timeLabel}</div>
            <div style="font-size:10px;color:var(--ink-soft);margin-bottom:5px;">${esc(theirLabel)}</div>
            <div style="font-size:10.5px;${peerSession && peerSession.topic ? '' : 'color:var(--ink-soft);'}">${topicLine}</div>
            ${peerBadges}
            ${actionHtml}
          </div>`);
      });

      const scrollHtml = peerCards.length
        ? `<div style="flex:1;min-width:0;display:flex;gap:10px;overflow-x:auto;padding-bottom:4px;">${peerCards.join('')}</div>`
        : `<div style="flex:1;min-width:0;display:flex;align-items:center;color:var(--ink-soft);font-size:12px;padding-left:6px;">No concurrent groups this date.</div>`;

      return `<div style="display:flex;gap:14px;margin-bottom:14px;align-items:stretch;">${anchorHtml}${scrollHtml}</div>`;
    }).join('');

    if(isApproved){
      rowsEl.querySelectorAll('[data-edit-date]').forEach(btn=>{
        btn.onclick = ()=>{
          const iso = btn.dataset.editDate;
          openSessionModal(nodeId, orgLabel, iso, myByDate[iso] || null, ()=> window.__refreshDashboard());
        };
      });
    }
    rowsEl.querySelectorAll('[data-req]').forEach(btn=>{
      btn.onclick = ()=> openSisterRequestModal(btn.dataset.req, btn.dataset.name, refreshMonth);
    });
    rowsEl.querySelectorAll('[data-respond]').forEach(btn=>{
      btn.onclick = ()=> openRespondModal(btn.dataset.respond, btn.dataset.name, refreshMonth);
    });
    wireMessageIcons(rowsEl);
  }

  boot();
})();
</script>
</body>
</html>
